services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predit_identity
      POSTGRES_USER: predit_identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_password}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predit_identity -d predit_identity"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [predit]

  risk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predit_risk
      POSTGRES_USER: predit_risk
      POSTGRES_PASSWORD: ${RISK_DB_PASSWORD:-risk_dev_password}
    volumes:
      - risk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predit_risk -d predit_risk"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [predit]

  identity-service:
    image: predit-identity-service:latest
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/predit_identity
      DB_USERNAME: predit_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-with-at-least-32-characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@predit.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    ports: ["8081:8081"]
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [predit]

  risk-service:
    image: predit-risk-service:latest
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://risk-db:5432/predit_risk
      DB_USERNAME: predit_risk
      DB_PASSWORD: ${RISK_DB_PASSWORD:-risk_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-with-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://localhost:3000,http://localhost:5173
      VIN_SHARE_PERCENT: ${VIN_SHARE_PERCENT:-68.0}
    ports: ["8082:8082"]
    depends_on:
      risk-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [predit]

volumes:
  identity-data:
  risk-data:

networks:
  predit:
    driver: bridge
