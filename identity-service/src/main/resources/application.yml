server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/predit_identity}
    username: ${DB_USERNAME:predit_identity}
    password: ${DB_PASSWORD:identity_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

predit:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    issuer: predit-identity
    expiration-minutes: 30
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@predit.com.br}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
