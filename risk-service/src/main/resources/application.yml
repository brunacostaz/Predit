server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: risk-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/predit_risk}
    username: ${DB_USERNAME:predit_risk}
    password: ${DB_PASSWORD:risk_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

predit:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    issuer: predit-identity
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000,http://localhost:5173}
  dashboard:
    vin-share-percent: ${VIN_SHARE_PERCENT:68.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    br.com.fiap.predit: INFO
